services:
  ticketops:
    build:
      context: .
      dockerfile: Dockerfile
      # Build-time env vars agar VITE_ tersedia saat `npm run build` di dalam Docker
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
    image: centerback/ticketops:latest
    container_name: ticketops-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Membaca env vars dari .env.local secara otomatis
    env_file:
      - path: .env.local
        required: false
    environment:
      - PORT=8080
      - NODE_ENV=production
      - ENABLE_SYNC_DAEMON=true
    security_opt:
      - apparmor:unconfined
