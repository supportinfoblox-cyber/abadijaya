name: iCare OTRS Automatic Sync to Supabase

on:
  push:
    branches: [ master, main ]
  schedule:
    # Runs automatically every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger directly from GitHub web UI


jobs:
  sync-icare:
    name: Sync iCare Tickets to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'


      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python & Node Dependencies
        run: |
          pip install requests urllib3
          npm install --prefer-offline --no-audit

      - name: Run iCare OTRS -> Supabase Synchronization
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          node scripts/sync_otrs_to_supabase.mjs

